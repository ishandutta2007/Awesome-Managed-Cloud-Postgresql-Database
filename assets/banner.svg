<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle animations */
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.65; }
        50% { transform: translateY(-8px) scale(1.05); opacity: 0.95; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating-orb1 {
        animation: floatPulse 7s ease-in-out infinite;
      }
      .floating-orb2 {
        animation: floatPulse 9s ease-in-out infinite reverse;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dataFlow 4s linear infinite;
      }
      .rotate-element {
        transform-origin: 1040px 180px;
        animation: rotateRing 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Animated Atmospheric Glows -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="floating-orb1" />
  <circle cx="950" cy="260" r="180" fill="#a855f7" opacity="0.1" filter="url(#glow)" class="floating-orb2" />
  <circle cx="600" cy="340" r="120" fill="#2563eb" opacity="0.1" filter="url(#glow)" />

  <!-- Subtle Modern Tech Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Right Side Decorative Dynamic Cluster (Elephant / Node abstraction) -->
  <g class="rotate-element" opacity="0.4">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 14" />
    <circle cx="1040" cy="180" r="140" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="10 20" />
  </g>

  <!-- Animated Data Connection Streams -->
  <path d="M 880 180 Q 960 120, 1040 180 T 1160 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="flow-line" />
  <path d="M 900 240 Q 980 290, 1040 180 T 1140 120" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" class="flow-line" />

  <!-- PostgreSQL Abstract Cylinder Database Stacks on the right -->
  <g transform="translate(1000, 125)" opacity="0.95">
    <!-- Cylinder 1 -->
    <path d="M 0 25 C 0 10, 80 10, 80 25 L 80 75 C 80 90, 0 90, 0 75 Z" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="40" cy="25" rx="40" ry="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="42" x2="80" y2="42" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="58" x2="80" y2="58" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <!-- Node indicator -->
    <circle cx="40" cy="25" r="4" fill="#38bdf8" filter="url(#lightGlow)" />
  </g>

  <!-- Foreground Content Area: Clear & Highly Legible -->
  <g transform="translate(70, 75)">
    <!-- Badge Pill -->
    <g transform="translate(0, 0)">
      <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="15" cy="15" r="5" fill="#38bdf8" filter="url(#lightGlow)" />
      <text x="30" y="20" class="pill-text" fill="#38bdf8">Curated Cloud DBaaS Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text">
      Awesome Managed Cloud PostgreSQL
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" class="subtitle-text">
      The authoritative index of enterprise DBaaS platforms, Kubernetes operators &amp; high-availability tools.
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Serverless & Autoscaling -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" class="pill-text">⚡ Serverless &amp; Scale</text>
      </g>
      <!-- Pill 2: High Availability & Failover -->
      <g transform="translate(195, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" class="pill-text">🛡️ HA &amp; Auto-Failover</text>
      </g>
      <!-- Pill 3: K8s Operators -->
      <g transform="translate(390, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" class="pill-text">☸️ K8s CloudNative</text>
      </g>
      <!-- Pill 4: Zero Lock-In -->
      <g transform="translate(570, 0)">
        <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="22" class="pill-text">🔓 Zero Lock-In OSS</text>
      </g>
    </g>
  </g>
</svg>
